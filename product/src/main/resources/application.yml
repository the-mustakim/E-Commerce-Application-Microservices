spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3306/ecomapp_product_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Mustakim@123
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
