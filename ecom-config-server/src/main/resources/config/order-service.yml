spring:
    application:
        name: order-service

    datasource:
        url: jdbc:mysql://localhost:3309/ecomapp_order_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            idle-timeout: 30000 # 30 sec
            max-lifetime: 1800000 # 30 min
            connection-timeout: 20000 # 20 sec
            pool-name: MyHikariCP
    jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
            ddl-auto: create
        show-sql: true

    rabbitmq:
        host: localhost
        port: 5672
        username: ${RB_USERNAME}
        password: ${RB_PASSWORD}

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always
    health:
        circuitbreakers:
            enabled: true
    tracing:
        sampling:
            probability: 1.0

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka
        register-with-eureka: true
        fetch-registry: true

logging:
    level:
        root: INFO
        com.ecommerce.user: TRACE
    file:
        name: logs/${spring.application.name}.log
    logback:
        rollingpolicy:
            max-file-size: 5MB
            max-history: 7

# Circuit Breaker
resilience4j:
    circuitbreaker:
        instances:
            productService:
                registerHealthIndicator: true
                slidingWindowSize: 10
                minimumNumberOfCalls: 5
                permittedNumberOfCallsInHalfOpenState: 3
                waitDurationInOpenState: 10s
                failureRateThreshold: 50
                automaticTransitionFromOpenToHalfOpenEnabled: true
                slidingWindowType: count_based
    retry:
        instances:
            retryBreaker:
                maxAttempts: 5
                waitDuration: 5s
    ratelimiter:
        instances:
            rateBreaker:
                timeout-duration: 0
                limit-refresh-period: 4s
                limit-for-period: 2

appp:
    message: "This is message.."

server:
    port: 8083